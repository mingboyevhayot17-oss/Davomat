<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c4d">
<title>Davomat</title>
<style>
:root{--bg:#edf0f4;--card:#fff;--tx:#16212e;--mu:#5f6b7a;--bd:#d8dee6;--pr:#0f5c4d;--prt:#fff;--wn:#a45a00;--er:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1419;--card:#18202a;--tx:#e8edf2;--mu:#93a0ae;--bd:#27313c;--pr:#3ecfa8;--prt:#06251d;--wn:#f0b45a;--er:#ff8a80}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0 0 8px;line-height:1.2}
h2{font-size:1.15rem}
.mu{color:var(--mu)}
.err{color:var(--er)}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.lnk{background:none;border:0;color:var(--mu);font:inherit;text-decoration:underline;padding:8px}
.tabs{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd)}
.tabs button{flex:1;padding:10px 12px;border:0;border-radius:8px;background:none;color:var(--mu);font:inherit;font-weight:600;white-space:nowrap}
.tabs .on{background:var(--pr);color:var(--prt)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin:10px 0}
.card summary{cursor:pointer;list-style:none}
.card summary::-webkit-details-marker{display:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:3px 0}
.warn b,.warn span:first-child{color:var(--wn)}
.reason{margin:6px 0;padding:8px 10px;border-left:3px solid var(--wn);background:var(--bg);border-radius:4px}
.tag{font-size:.8rem;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.strike{text-decoration:line-through;color:var(--mu)}
label{display:block;margin:10px 0;font-size:.92rem;color:var(--mu)}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px}
.chk{display:flex;align-items:center;gap:8px}
.chk input{width:auto;margin:0}
.btn{display:block;width:100%;margin:8px 0;padding:13px;font:inherit;font-weight:600;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px}
.btn.pri{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.btn.sm{padding:9px;font-size:.9rem}
.btn:disabled{opacity:.4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two label{margin:10px 0 0}
.login{padding-top:12vh}
.login h1{font-size:2rem}
.emp{text-align:center}
.clock{font-size:3.6rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:8px}
.msg{min-height:1.5em;margin:10px 0}
.big{height:5.5rem;margin:12px 0;font-size:1.6rem;font-weight:700;border-radius:14px;border:2px solid var(--pr);background:var(--pr);color:var(--prt);width:100%}
.big.out{background:var(--card);color:var(--pr)}
.big:disabled{opacity:.35}
.emp .card{text-align:left}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0}
.sheet video,.sheet img{width:100%;border-radius:10px;background:#000;display:block;margin:6px 0}
#toast{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));padding:12px 14px;border-radius:10px;background:var(--tx);color:var(--bg);display:none;z-index:30}
#toast.show{display:block}
#toast.err{background:var(--er);color:#fff}
</style>
</head>
<body>
<div id="app"><p class="mu" style="padding:16px">Yuklanmoqda...</p></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<script>
const SB_URL = "https://iqkdksbhclskuslttzid.supabase.co";
const SB_KEY = "sb_publishable__e4TQ9l2ec2zW9yPw3GH2g_IBKIeHNa";
const sb = supabase.createClient(SB_URL, SB_KEY);
const app = document.getElementById("app");
let me = null, settings = null, tab = "today", clockTimer, EMP = {}, RC = {};
let repMonth = null;

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => Number(n || 0).toLocaleString("ru-RU") + " so'm";
const fmtT = iso => iso ? new Date(iso).toLocaleTimeString("en-GB", {timeZone:"Asia/Tashkent", hour:"2-digit", minute:"2-digit"}) : "—";
const hm = s => String(s).slice(0, 5);
const toMin = s => { const [h, m] = String(s).split(":"); return +h * 60 + +m; };
const toEmail = l => { l = l.trim().toLowerCase(); return l.includes("@") ? l : l + "@davomat.app"; };
function tzNow() {
  const p = new Intl.DateTimeFormat("en-CA", {timeZone:"Asia/Tashkent", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hourCycle:"h23"}).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  return {date: `${g("year")}-${g("month")}-${g("day")}`, min: (+g("hour")) * 60 + (+g("minute"))};
}
function dist(a, b, c, d) {
  const r = x => x * Math.PI / 180;
  const h = Math.sin(r(c - a) / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(r(d - b) / 2) ** 2;
  return 6371000 * 2 * Math.asin(Math.sqrt(h));
}
function toast(t, err) {
  const e = document.getElementById("toast");
  e.textContent = t; e.className = "show" + (err ? " err" : "");
  clearTimeout(toast.t); toast.t = setTimeout(() => e.className = "", err ? 7000 : 2500);
}
function modal(html) {
  const o = document.createElement("div");
  o.className = "ov";
  o.innerHTML = `<div class="sheet">${html}</div>`;
  document.body.appendChild(o);
  return {el: o.firstChild, close: () => o.remove()};
}
function errText(e) {
  if (typeof GeolocationPositionError !== "undefined" && e instanceof GeolocationPositionError) {
    if (e.code === 1) return "Joylashuvga ruxsat bering: brauzer sozlamalarida joylashuvni yoqing.";
    return "Joylashuv aniqlanmadi. GPS yoqilganini tekshirib, qayta urinib ko'ring.";
  }
  if (e && (e.name === "NotAllowedError" || e.name === "NotFoundError")) return "Kameraga ruxsat bering: brauzer sozlamalarida kamerani yoqing.";
  if (e && e.code === -1) return "Bu brauzer joylashuvni qo'llab-quvvatlamaydi.";
  return (e && e.message) || "Xatolik yuz berdi";
}
const topbar = () => `<header class="top"><b>${esc(me.full_name)}</b><button class="lnk" onclick="logout()">Chiqish</button></header>`;
async function logout() { clearInterval(clockTimer); await sb.auth.signOut(); me = null; loginView(); }

/* ---------- start / login ---------- */
async function boot() {
  const {data: {session}} = await sb.auth.getSession();
  if (!session) return loginView();
  const {data, error} = await sb.from("employees").select("*").eq("user_id", session.user.id).maybeSingle();
  if (error || !data || !data.active) {
    app.innerHTML = `<main><p class="err">Bu akkaunt hodim sifatida topilmadi yoki faol emas. Admin bilan bog'laning.</p><button class="btn" onclick="logout()">Chiqish</button></main>`;
    return;
  }
  me = data;
  const {data: s} = await sb.from("settings").select("*").eq("id", 1).single();
  settings = s;
  me.is_admin ? adminView() : empView();
}
function loginView() {
  app.innerHTML = `<main class="login"><h1>Davomat</h1><p class="mu">Login va PIN-kodingizni kiriting.</p>
  <label>Login<input id="lg" autocomplete="username" autocapitalize="none" autocorrect="off"></label>
  <label>PIN-kod<input id="pw" type="password" autocomplete="current-password"></label>
  <button class="btn pri" id="go">Kirish</button><p id="er" class="err"></p></main>`;
  const go = async () => {
    const er = document.getElementById("er");
    er.textContent = "";
    const {error} = await sb.auth.signInWithPassword({email: toEmail(document.getElementById("lg").value), password: document.getElementById("pw").value});
    if (error) { er.textContent = /invalid login/i.test(error.message) ? "Login yoki PIN-kod noto'g'ri" : error.message; return; }
    boot();
  };
  document.getElementById("go").onclick = go;
  document.getElementById("pw").onkeydown = e => { if (e.key === "Enter") go(); };
}

/* ---------- employee ---------- */
const recCard = r => `<div class="card"><div class="row"><span>Keldi</span><b>${fmtT(r.check_in)}</b></div>
<div class="row"><span>Ketdi</span><b>${fmtT(r.check_out)}</b></div>
${r.late_minutes > 0 ? `<div class="row warn"><span>Kechikish</span><b>${r.late_minutes} daqiqa</b></div>
<div class="row"><span>Shtraf</span><b>${r.fine_waived ? "ozod qilingan" : money(r.fine_amount)}</b></div>
${r.late_reason ? `<div class="mu">Sabab: ${esc(r.late_reason)}</div>` : ""}` : ""}</div>`;
const msg = (t, err) => { const e = document.getElementById("msg"); if (e) { e.textContent = t; e.className = "msg" + (err ? " err" : ""); } };
function tick() { const e = document.getElementById("clk"); if (e) e.textContent = new Date().toLocaleTimeString("en-GB", {timeZone:"Asia/Tashkent"}); }

async function empView() {
  const t = tzNow();
  const {data: rec} = await sb.from("attendance").select("*").eq("employee_id", me.id).eq("work_date", t.date).maybeSingle();
  const st = !rec ? "in" : (!rec.check_out ? "out" : "done");
  app.innerHTML = `${topbar()}<main class="emp"><div class="clock" id="clk"></div>
  <div class="mu">Sizning jadvalingiz: ${hm(me.work_start)} – ${hm(me.work_end)}</div>
  <div id="msg" class="msg"></div>
  <button class="big" ${st !== "in" ? "disabled" : ""} onclick="act('in')">Keldim</button>
  <button class="big out" ${st !== "out" ? "disabled" : ""} onclick="act('out')">Ketdim</button>
  ${rec ? recCard(rec) : ""}</main>`;
  tick(); clearInterval(clockTimer); clockTimer = setInterval(tick, 1000);
}
const getPos = () => new Promise((res, rej) => navigator.geolocation
  ? navigator.geolocation.getCurrentPosition(res, rej, {enableHighAccuracy: true, timeout: 20000, maximumAge: 0})
  : rej({code: -1}));
async function selfie() {
  const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "user", width: {ideal: 960}}, audio: false});
  return new Promise(res => {
    const m = modal(`<video id="vd" autoplay playsinline muted></video><div class="two"><button class="btn" id="cx">Bekor qilish</button><button class="btn pri" id="sn">Suratga olish</button></div>`);
    const v = m.el.querySelector("#vd"); v.srcObject = stream;
    const stop = () => { stream.getTracks().forEach(t => t.stop()); m.close(); };
    m.el.querySelector("#cx").onclick = () => { stop(); res(null); };
    m.el.querySelector("#sn").onclick = () => {
      if (!v.videoWidth) return;
      const w = Math.min(720, v.videoWidth), h = Math.round(v.videoHeight * w / v.videoWidth);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(v, 0, 0, w, h);
      c.toBlob(b => { stop(); res(b); }, "image/jpeg", .7);
    };
  });
}
const askReason = late => new Promise(res => {
  const m = modal(`<h3>Siz ${late} daqiqa kechikdingiz</h3><p class="mu">Sababini yozing, admin ko'rib chiqadi.</p>
  <textarea id="rs" rows="3" placeholder="Masalan: yo'lda tirbandlik bo'ldi"></textarea>
  <div class="two"><button class="btn" id="b1">Bekor qilish</button><button class="btn pri" id="b2">Davom etish</button></div>`);
  m.el.querySelector("#b1").onclick = () => { m.close(); res(undefined); };
  m.el.querySelector("#b2").onclick = () => { const v = m.el.querySelector("#rs").value.trim(); m.close(); res(v); };
});
async function act(kind) {
  document.querySelectorAll(".big").forEach(b => b.disabled = true);
  let note = ["", false];
  try {
    msg("Joylashuv aniqlanmoqda...");
    const pos = await getPos();
    const la = pos.coords.latitude, lo = pos.coords.longitude;
    const d = Math.round(dist(la, lo, settings.office_lat, settings.office_lng));
    if (d > settings.radius_m) { note = [`Siz ofisdan ${d} m uzoqdasiz. Ruxsat etilgan masofa: ${settings.radius_m} m.`, true]; return; }
    let reason = null;
    if (kind === "in") {
      const late = tzNow().min - toMin(me.work_start);
      if (late > 0) { reason = await askReason(late); if (reason === undefined) return; }
    }
    msg("Kamera ochilmoqda...");
    const blob = await selfie();
    if (!blob) return;
    msg("Yuklanmoqda...");
    const path = `${me.user_id}/${tzNow().date}-${kind}-${Date.now()}.jpg`;
    const up = await sb.storage.from("photos").upload(path, blob, {contentType: "image/jpeg"});
    if (up.error) throw up.error;
    const r = kind === "in"
      ? await sb.rpc("check_in", {p_lat: la, p_lng: lo, p_photo: path, p_reason: reason || null})
      : await sb.rpc("check_out", {p_lat: la, p_lng: lo, p_photo: path});
    if (r.error) throw r.error;
    note = [kind === "in" ? "Kelish vaqti yozildi" : "Ketish vaqti yozildi", false];
  } catch (e) { note = [errText(e), true]; }
  finally { await empView(); msg(note[0], note[1]); }
}

/* ---------- admin ---------- */
const pane = () => document.getElementById("pane");
const setTab = k => { tab = k; adminView(); };
async function adminView() {
  if (!repMonth) repMonth = tzNow().date.slice(0, 7);
  app.innerHTML = `${topbar()}<nav class="tabs">${[["today","Bugun"],["report","Hisobot"],["staff","Hodimlar"],["set","Ofis"]]
    .map(([k, n]) => `<button class="${tab === k ? "on" : ""}" onclick="setTab('${k}')">${n}</button>`).join("")}</nav><main id="pane"></main>`;
  await ({today: tabToday, report: tabReport, staff: tabStaff, set: tabSet})[tab]();
}
function recAdmin(r) {
  RC[r.id] = r;
  const late = r.late_minutes > 0;
  return `<div class="row"><span>Keldi</span><b>${fmtT(r.check_in)}</b></div>
  <div class="row"><span>Ketdi</span><b>${fmtT(r.check_out)}</b></div>
  ${late ? `<div class="row warn"><span>Kechikish</span><b>${r.late_minutes} daqiqa</b></div>
  <div class="row"><span>Shtraf</span><span><b class="${r.fine_waived ? "strike" : ""}">${money(r.fine_amount)}</b> ${r.fine_waived ? '<span class="tag">ozod</span>' : ""}</span></div>
  ${r.late_reason ? `<div class="reason">Sabab: ${esc(r.late_reason)}</div>` : '<div class="mu">Sabab yozilmagan</div>'}` : ""}
  <div class="two"><button class="btn sm" onclick="photos('${r.id}')">Rasmlar</button>
  ${late && r.fine_amount > 0 ? `<button class="btn sm ${r.fine_waived ? "" : "pri"}" onclick="waive('${r.id}',${!r.fine_waived})">${r.fine_waived ? "Shtrafni qaytarish" : "Shtrafdan ozod qilish"}</button>` : "<span></span>"}</div>`;
}
async function waive(id, v) {
  const {error} = await sb.from("attendance").update({fine_waived: v}).eq("id", id);
  if (error) return toast(error.message, 1);
  toast(v ? "Shtrafdan ozod qilindi" : "Shtraf qaytarildi");
  adminView();
}
async function photos(id) {
  const r = RC[id];
  const m = modal(`<p class="mu">Yuklanmoqda...</p>`);
  const get = async p => p ? (await sb.storage.from("photos").createSignedUrl(p, 600)).data?.signedUrl : null;
  const [i, o] = await Promise.all([get(r.in_photo), get(r.out_photo)]);
  const map = (la, lo) => la ? `<a href="https://www.google.com/maps?q=${la},${lo}" target="_blank" rel="noopener">Xaritada ko'rish</a>` : "";
  m.el.innerHTML = `<h3>Rasmlar</h3>
  ${i ? `<p>Keldi, ${fmtT(r.check_in)}</p><img src="${i}" alt="">${map(r.in_lat, r.in_lng)}` : ""}
  ${o ? `<p>Ketdi, ${fmtT(r.check_out)}</p><img src="${o}" alt="">${map(r.out_lat, r.out_lng)}` : ""}
  <button class="btn" id="cl">Yopish</button>`;
  m.el.querySelector("#cl").onclick = m.close;
}
async function tabToday() {
  pane().innerHTML = '<p class="mu">Yuklanmoqda...</p>';
  const t = tzNow();
  const [a, b] = await Promise.all([
    sb.from("employees").select("*").eq("active", true).eq("is_admin", false).order("full_name"),
    sb.from("attendance").select("*").eq("work_date", t.date)]);
  if (a.error || b.error) return pane().innerHTML = `<p class="err">${esc((a.error || b.error).message)}</p>`;
  const by = Object.fromEntries(b.data.map(r => [r.employee_id, r]));
  pane().innerHTML = `<h2>Bugun, ${t.date}</h2>` + (a.data.length ? a.data.map(e => {
    const r = by[e.id];
    return `<div class="card"><div class="row"><b>${esc(e.full_name)}</b><span class="mu">${hm(e.work_start)}–${hm(e.work_end)}</span></div>${r ? recAdmin(r) : '<div class="mu">Hali kelmagan</div>'}</div>`;
  }).join("") : `<p class="mu">Hodimlar yo'q. "Hodimlar" bo'limidan qo'shing.</p>`);
}
async function tabReport() {
  const [y, mo] = repMonth.split("-").map(Number);
  const from = `${repMonth}-01`;
  const nx = mo === 12 ? `${y + 1}-01-01` : `${y}-${String(mo + 1).padStart(2, "0")}-01`;
  pane().innerHTML = `<label>Oy<input type="month" id="mm" value="${repMonth}"></label><div id="rp"><p class="mu">Yuklanmoqda...</p></div>`;
  document.getElementById("mm").onchange = e => { repMonth = e.target.value || repMonth; tabReport(); };
  const {data, error} = await sb.from("attendance").select("*,employees(full_name)").gte("work_date", from).lt("work_date", nx).order("work_date", {ascending: false});
  const rp = document.getElementById("rp");
  if (error) return rp.innerHTML = `<p class="err">${esc(error.message)}</p>`;
  if (!data.length) return rp.innerHTML = '<p class="mu">Bu oyda yozuv yo\'q.</p>';
  const g = {};
  data.forEach(r => {
    const n = r.employees?.full_name || "?";
    const x = g[n] ??= {days: 0, late: 0, min: 0, fine: 0};
    x.days++;
    if (r.late_minutes > 0) { x.late++; x.min += r.late_minutes; }
    if (!r.fine_waived) x.fine += r.fine_amount;
  });
  const total = Object.values(g).reduce((s, x) => s + x.fine, 0);
  rp.innerHTML = `<div class="card scroll"><table><tr><th>Hodim</th><th>Kun</th><th>Kech.</th><th>Daq.</th><th>Shtraf</th></tr>
  ${Object.entries(g).map(([n, x]) => `<tr><td>${esc(n)}</td><td>${x.days}</td><td>${x.late}</td><td>${x.min}</td><td>${money(x.fine)}</td></tr>`).join("")}
  <tr><td><b>Jami</b></td><td></td><td></td><td></td><td><b>${money(total)}</b></td></tr></table></div>
  <h2>Kunlar bo'yicha</h2>
  ${data.map(r => `<details class="card"><summary><div class="row"><b>${esc(r.employees?.full_name || "?")}</b><span class="mu">${r.work_date}${r.late_minutes > 0 ? `, <span style="color:var(--wn)">${r.late_minutes} daq. kech</span>` : ""}</span></div></summary>${recAdmin(r)}</details>`).join("")}`;
}
const fineLabel = e => (e.fine_mode === "none" ? "shtrafsiz" : e.fine_mode === "per_minute" ? `${money(e.per_minute_amount)} / daqiqa` : "bosqichli shtraf")
  + (e.grace_minutes > 0 ? `, ${e.grace_minutes} daq. imtiyoz` : "");
const tiersToText = t => (t || []).map(x => `${x.from}-${x.to}=${x.amount}`).join("\n");
async function tabStaff() {
  const {data, error} = await sb.from("employees").select("*").eq("is_admin", false).order("full_name");
  if (error) return pane().innerHTML = `<p class="err">${esc(error.message)}</p>`;
  EMP = {}; data.forEach(e => EMP[e.id] = e);
  pane().innerHTML = `<button class="btn pri" onclick="editEmp()">Yangi hodim qo'shish</button>` + data.map(e =>
    `<div class="card" onclick="editEmp('${e.id}')"><div class="row"><b>${esc(e.full_name)}</b>${e.active ? "" : '<span class="tag">faol emas</span>'}</div>
    <div class="mu">${hm(e.work_start)}–${hm(e.work_end)}, ${fineLabel(e)}</div></div>`).join("");
}
function editEmp(id) {
  const e = id ? EMP[id] : {full_name: "", work_start: "09:00", work_end: "18:00", fine_mode: "per_minute", per_minute_amount: 0, grace_minutes: 0, tiers: [], active: true};
  const opt = (v, n) => `<option value="${v}" ${e.fine_mode === v ? "selected" : ""}>${n}</option>`;
  const m = modal(`<h3>${id ? "Hodimni tahrirlash" : "Yangi hodim"}</h3>
  <label>Ism-familiya<input id="f_n" value="${esc(e.full_name)}"></label>
  ${id ? "" : `<label>Login (lotin harflarida)<input id="f_l" autocapitalize="none" placeholder="ali"></label>
  <label>PIN-kod (6 ta raqam)<input id="f_p" inputmode="numeric" maxlength="6"></label>`}
  <div class="two"><label>Kelish vaqti<input type="time" id="f_s" value="${hm(e.work_start)}"></label><label>Ketish vaqti<input type="time" id="f_e" value="${hm(e.work_end)}"></label></div>
  <label>Shtraf turi<select id="f_m">${opt("per_minute", "Daqiqasiga")}${opt("tiered", "Bosqichli")}${opt("none", "Shtrafsiz")}</select></label>
  <label>Daqiqasiga shtraf (so'm)<input type="number" id="f_a" inputmode="numeric" value="${e.per_minute_amount}"></label>
  <label>Imtiyozli vaqt (daqiqa)<input type="number" id="f_g" inputmode="numeric" value="${e.grace_minutes}"></label>
  <label>Bosqichlar (har qatorda: dan-gacha=summa)<textarea id="f_t" rows="4" placeholder="1-15=10000&#10;16-30=30000&#10;31-999=50000">${esc(tiersToText(e.tiers))}</textarea></label>
  ${id ? `<label class="chk"><input type="checkbox" id="f_x" ${e.active ? "checked" : ""}> Faol hodim</label>` : ""}
  <div class="two"><button class="btn" id="c">Bekor qilish</button><button class="btn pri" id="s">Saqlash</button></div><p class="err" id="fe"></p>`);
  const q = s => m.el.querySelector(s);
  q("#c").onclick = m.close;
  q("#s").onclick = async () => {
    const fe = q("#fe"); fe.textContent = "";
    const name = q("#f_n").value.trim();
    if (!name) { fe.textContent = "Ismni kiriting"; return; }
    const tiers = [];
    for (const ln of q("#f_t").value.split("\n").map(x => x.trim()).filter(Boolean)) {
      const k = ln.match(/^(\d+)\s*-\s*(\d+)\s*=\s*(\d+)$/);
      if (!k) { fe.textContent = `Bosqich noto'g'ri yozilgan: ${ln}`; return; }
      tiers.push({from: +k[1], to: +k[2], amount: +k[3]});
    }
    const row = {full_name: name, work_start: q("#f_s").value, work_end: q("#f_e").value, fine_mode: q("#f_m").value,
      per_minute_amount: +q("#f_a").value || 0, grace_minutes: +q("#f_g").value || 0, tiers};
    q("#s").disabled = true;
    if (id) {
      row.active = q("#f_x").checked;
      const {error} = await sb.from("employees").update(row).eq("id", id);
      if (error) { fe.textContent = error.message; q("#s").disabled = false; return; }
      toast("Saqlandi");
    } else {
      const lg = q("#f_l").value.trim().toLowerCase(), pin = q("#f_p").value.trim();
      if (!/^[a-z0-9._-]{3,}$/.test(lg)) { fe.textContent = "Login kamida 3 ta lotin harf yoki raqam bo'lsin"; q("#s").disabled = false; return; }
      if (!/^\d{6}$/.test(pin)) { fe.textContent = "PIN-kod 6 ta raqam bo'lsin"; q("#s").disabled = false; return; }
      const tmp = supabase.createClient(SB_URL, SB_KEY, {auth: {persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: "tmp-signup"}});
      const {data: u, error: e1} = await tmp.auth.signUp({email: toEmail(lg), password: pin});
      if (e1 || !u.user) { fe.textContent = e1 ? e1.message : "Akkaunt yaratilmadi"; q("#s").disabled = false; return; }
      const {error: e2} = await sb.from("employees").insert({...row, user_id: u.user.id});
      if (e2) { fe.textContent = e2.message; q("#s").disabled = false; return; }
      toast(u.session ? "Hodim qo'shildi" : "Hodim qo'shildi, lekin Supabase'da \"Confirm email\" yoqilgan. Uni o'chiring.", !u.session);
    }
    m.close(); tabStaff();
  };
}
async function tabSet() {
  const {data: s} = await sb.from("settings").select("*").eq("id", 1).single();
  settings = s;
  pane().innerHTML = `<h2>Ofis joylashuvi</h2>
  <label>Kenglik (lat)<input id="la" value="${s.office_lat}"></label>
  <label>Uzunlik (lng)<input id="lo" value="${s.office_lng}"></label>
  <label>Radius (metr)<input id="rd" type="number" inputmode="numeric" value="${s.radius_m}"></label>
  <button class="btn" id="here">Hozirgi joylashuvni ofis qilish</button>
  <button class="btn pri" id="sv">Saqlash</button>`;
  document.getElementById("here").onclick = async () => {
    try {
      const p = await getPos();
      document.getElementById("la").value = p.coords.latitude;
      document.getElementById("lo").value = p.coords.longitude;
      toast("Joylashuv olindi. Saqlash tugmasini bosing.");
    } catch (e) { toast(errText(e), 1); }
  };
  document.getElementById("sv").onclick = async () => {
    const n = id => parseFloat(String(document.getElementById(id).value).replace(",", "."));
    const row = {office_lat: n("la"), office_lng: n("lo"), radius_m: Math.round(n("rd"))};
    if ([row.office_lat, row.office_lng, row.radius_m].some(x => !isFinite(x)) || row.radius_m < 10) return toast("Qiymatlarni to'g'ri kiriting", 1);
    const {error} = await sb.from("settings").update(row).eq("id", 1);
    if (error) return toast(error.message, 1);
    settings = {...settings, ...row};
    toast("Saqlandi");
  };
}

boot();
</script>
</body>
</html>
